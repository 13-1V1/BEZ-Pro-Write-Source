[package]
name = "bez-pro-write"
version = "1.4.0"
description = "BEZ Pro Write: guided professional writing with the 7 C's"
authors = ["Brennan Meyer"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "bez_pro_write_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Only one copy of the app at a time, so two windows can't overwrite the same draft.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
